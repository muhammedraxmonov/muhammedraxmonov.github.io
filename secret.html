<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Muhammed.R — Secret</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: #f2f0eb;
    font-family: Georgia, "Times New Roman", serif;
}

.page {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px;
}

.secret {
    width: 100%;
    max-width: 700px;

    text-align: center;
}

.label {
    font-family: Arial, sans-serif;

    font-size: 9px;
    letter-spacing: 6px;

    color: #555555;

    margin-bottom: 40px;
}

h1 {
    font-size:
        clamp(55px, 12vw, 120px);

    font-weight: normal;

    line-height: 0.9;

    margin: 0;
}

.message {
    margin-top: 40px;

    font-size: 20px;

    line-height: 1.6;

    color: #777777;
}

.line {
    width: 100%;
    height: 1px;

    background: #292929;

    margin: 60px 0;
}

.quote {
    font-size: 24px;

    font-style: italic;

    line-height: 1.6;

    color: #aaa7a1;
}

.signature {
    margin-top: 50px;

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 5px;

    color: #555555;
}

.back {
    display: inline-block;

    margin-top: 70px;

    color: #666666;

    text-decoration: none;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 4px;

    transition: color 0.3s ease;
}

.back:hover {
    color: #ffffff;
}

</style>

</head>


<body>


<div class="page">


<div class="secret">


<div class="label">
PRIVATE · 001
</div>


<h1>
ACCESS<br>
GRANTED.
</h1>


<div class="message">

You found something
that wasn't meant to be found.

</div>


<div class="line"></div>


<div class="quote">

“Some things are meant
to remain hidden.”

</div>


<div class="signature">

MUHAMMED.R

</div>


<a
    href="index.html"
    class="back"
>
    ← RETURN
</a>


</div>


</div>


</body>

</html>

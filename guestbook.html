<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Muhammed.R — Guestbook</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #111111;
    color: #eeeeee;
    font-family: "Courier New", monospace;
    min-height: 100vh;
}

.container {
    width: min(900px, 92%);
    margin: 0 auto;
    padding: 50px 0 80px;
}

/* TOP */

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 80px;
}

.logo {
    font-size: 18px;
    letter-spacing: 2px;
    color: #ffffff;
}

.back {
    color: #888888;
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 1px;
    transition: 0.3s;
}

.back:hover {
    color: #ffffff;
}

/* HEADER */

.hero {
    margin-bottom: 70px;
}

.small-title {
    color: #777777;
    font-size: 12px;
    letter-spacing: 3px;
    margin-bottom: 20px;
}

h1 {
    font-size: clamp(38px, 8vw, 78px);
    font-weight: 400;
    line-height: 0.95;
    margin: 0 0 25px;
    letter-spacing: -3px;
}

.intro {
    max-width: 600px;
    color: #999999;
    font-size: 14px;
    line-height: 1.8;
}

/* FORM */

.form {
    border-top: 1px solid #2a2a2a;
    border-bottom: 1px solid #2a2a2a;
    padding: 45px 0;
    margin-bottom: 70px;
}

.field {
    margin-bottom: 35px;
}

label {
    display: block;
    color: #777777;
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 12px;
}

input,
textarea {
    width: 100%;
    border: 1px solid #333333;
    background: #151515;
    color: #eeeeee;
    padding: 16px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: 0.3s;
    border-radius: 0;
}

input:focus,
textarea:focus {
    border-color: #777777;
}

textarea {
    min-height: 160px;
    resize: vertical;
}

input::placeholder,
textarea::placeholder {
    color: #555555;
}

.submit {
    display: inline-block;
    border: 1px solid #555555;
    background: transparent;
    color: #eeeeee;
    padding: 15px 25px;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: 0.3s;
}

.submit:hover {
    background: #eeeeee;
    color: #111111;
}

.submit:disabled {
    opacity: 0.5;
    cursor: wait;
}

#status {
    margin-top: 20px;
    font-size: 11px;
    letter-spacing: 2px;
    min-height: 18px;
    color: #888888;
}

/* REVIEWS */

.reviews-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.reviews-title {
    font-size: 12px;
    letter-spacing: 3px;
    color: #777777;
}

.review-count {
    font-size: 11px;
    color: #555555;
}

.review {
    border-top: 1px solid #2a2a2a;
    padding: 30px 0;
}

.review:last-child {
    border-bottom: 1px solid #2a2a2a;
}

.review-top {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 15px;
}

.review-name {
    color: #eeeeee;
    font-size: 13px;
    letter-spacing: 1px;
}

.review-date {
    color: #555555;
    font-size: 10px;
}

.review-message {
    color: #999999;
    font-size: 13px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-word;
}

.empty {
    color: #555555;
    font-size: 12px;
    padding: 30px 0;
}

.loading {
    color: #555555;
    font-size: 12px;
    padding: 30px 0;
}

/* FOOTER */

footer {
    margin-top: 100px;
    padding-top: 25px;
    border-top: 1px solid #222222;
    color: #555555;
    font-size: 10px;
    letter-spacing: 2px;
}

/* MOBILE */

@media (max-width: 600px) {

    .container {
        width: 88%;
        padding-top: 30px;
    }

    .top {
        margin-bottom: 60px;
    }

    h1 {
        letter-spacing: -2px;
    }

    .hero {
        margin-bottom: 55px;
    }

    .form {
        padding: 35px 0;
        margin-bottom: 55px;
    }

    .review-top {
        flex-direction: column;
        gap: 8px;
    }

    footer {
        margin-top: 70px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- TOP -->

    <div class="top">

        <div class="logo">
            MUHAMMED.R
        </div>

        <a class="back" href="index.html">
            ← HOME
        </a>

    </div>


    <!-- HERO -->

    <section class="hero">

        <div class="small-title">
            PERSONAL ARCHIVE
        </div>

        <h1>
            Guestbook
        </h1>

        <div class="intro">
            Leave a thought, a feeling, or simply a few words.
            Something small can remain for a long time.
        </div>

    </section>


    <!-- FORM -->

    <div class="form">

        <div class="field">

            <label for="name">
                NAME · OPTIONAL
            </label>

            <input
                id="name"
                type="text"
                placeholder="Anonymous"
                maxlength="40"
                autocomplete="name"
            >

        </div>


        <div class="field">

            <label for="message">
                YOUR MESSAGE
            </label>

            <textarea
                id="message"
                placeholder="What did you feel here?"
                maxlength="300"
            ></textarea>

        </div>


        <button
            class="submit"
            id="submitButton"
            type="button"
            onclick="sendMessage()"
        >
            LEAVE A TRACE →
        </button>


        <div id="status"></div>

    </div>


    <!-- REVIEWS -->

    <section>

        <div class="reviews-header">

            <div class="reviews-title">
                VISITORS' THOUGHTS
            </div>

            <div
                class="review-count"
                id="reviewCount"
            >
                0
            </div>

        </div>


        <div id="reviews">

            <div class="loading">
                LOADING...
            </div>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>
        PERSONAL ARCHIVE · MUHAMMED.R
    </footer>

</div>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://dixbzkpjugntycfnfwze.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_w5dES3PoPGIG9iGatAJDnw_A0vJu_wb";


/* =========================================================
   SEND MESSAGE
   ========================================================= */

async function sendMessage() {

    const nameInput =
        document.getElementById("name");

    const messageInput =
        document.getElementById("message");

    const status =
        document.getElementById("status");

    const button =
        document.getElementById("submitButton");


    const name =
        nameInput.value.trim();

    const message =
        messageInput.value.trim();


    /* Message is required */

    if (!message) {

        status.textContent =
            "WRITE SOMETHING FIRST.";

        return;
    }


    button.disabled = true;

    status.textContent =
        "SENDING...";


    try {

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/reviews`,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        `Bearer ${SUPABASE_KEY}`,

                    "Prefer":
                        "return=minimal"
                },

                body: JSON.stringify({

                    name:
                        name || "Anonymous",

                    message:
                        message,

                    approved:
                        false
                })
            }
        );


        if (!response.ok) {

            const error =
                await response.text();

            console.error(
                "Supabase error:",
                error
            );

            status.textContent =
                "SOMETHING WENT WRONG.";

            button.disabled = false;

            return;
        }


        /* Success */

        status.textContent =
            "MESSAGE RECEIVED.";


        nameInput.value = "";

        messageInput.value = "";


        button.disabled = false;


        /*
         * New review is not shown immediately
         * because approved = false.
         *
         * It will appear after you approve it
         * in Supabase.
         */

    } catch (error) {

        console.error(error);

        status.textContent =
            "CONNECTION ERROR.";

        button.disabled = false;
    }
}


/* =========================================================
   SECURITY
   ========================================================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =========================================================
   LOAD APPROVED REVIEWS
   ========================================================= */

async function loadReviews() {

    const reviewsContainer =
        document.getElementById("reviews");

    const countElement =
        document.getElementById("reviewCount");


    try {

        const response = await fetch(

            `${SUPABASE_URL}/rest/v1/reviews` +
            `?approved=eq.true` +
            `&select=id,created_at,name,message` +
            `&order=created_at.desc`,

            {
                method: "GET",

                headers: {
                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        `Bearer ${SUPABASE_KEY}`
                }
            }
        );


        if (!response.ok) {

            const error =
                await response.text();

            console.error(
                "Supabase error:",
                error
            );

            reviewsContainer.innerHTML =
                `<div class="empty">
                    UNABLE TO LOAD MESSAGES.
                </div>`;

            return;
        }


        const reviews =
            await response.json();


        countElement.textContent =
            reviews.length;


        if (!reviews.length) {

            reviewsContainer.innerHTML =
                `<div class="empty">
                    NO THOUGHTS YET.
                </div>`;

            return;
        }


        reviewsContainer.innerHTML =
            reviews.map(review => {

                const date =
                    new Date(
                        review.created_at
                    );


                const formattedDate =
                    date.toLocaleDateString(
                        "en-GB",
                        {
                            day: "2-digit",
                            month: "2-digit",
                            year: "numeric"
                        }
                    );


                return `

                    <article class="review">

                        <div class="review-top">

                            <div class="review-name">
                                ${escapeHTML(
                                    review.name ||
                                    "Anonymous"
                                )}
                            </div>

                            <div class="review-date">
                                ${formattedDate}
                            </div>

                        </div>


                        <div class="review-message">
                            ${escapeHTML(
                                review.message || ""
                            )}
                        </div>

                    </article>

                `;

            }).join("");


    } catch (error) {

        console.error(error);

        reviewsContainer.innerHTML =
            `<div class="empty">
                CONNECTION ERROR.
            </div>`;
    }
}


/* =========================================================
   START
   ========================================================= */

loadReviews();

</script>

</body>
</html>

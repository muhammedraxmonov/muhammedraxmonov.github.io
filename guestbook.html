<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Muhammed.R — Leave a Trace</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #111111;
    color: #eeeeee;
    font-family: "Courier New", monospace;
}

.page {
    width: min(900px, 92%);
    margin: 0 auto;
    padding: 70px 0;
}

/* HEADER */

.header {
    text-align: center;
    margin-bottom: 70px;
}

.header h1 {
    margin: 0;
    font-size: clamp(40px, 8vw, 76px);
    font-weight: 400;
    letter-spacing: 5px;
}

.header p {
    margin-top: 18px;
    color: #888888;
    font-size: 14px;
    letter-spacing: 2px;
}

/* INTRO */

.intro {
    text-align: center;
    margin-bottom: 55px;
}

.intro h2 {
    font-size: 20px;
    font-weight: 400;
    letter-spacing: 3px;
}

.intro p {
    color: #888888;
    line-height: 1.8;
}

/* FORM */

.form {
    border: 1px solid #333333;
    padding: 30px;
    margin-bottom: 70px;
}

.field {
    margin-bottom: 25px;
}

.field label {
    display: block;
    margin-bottom: 10px;
    color: #aaaaaa;
    font-size: 12px;
    letter-spacing: 2px;
}

input,
textarea {
    width: 100%;
    border: 1px solid #333333;
    background: #171717;
    color: #eeeeee;
    padding: 15px;
    font-family: inherit;
    font-size: 15px;
    outline: none;
}

input:focus,
textarea:focus {
    border-color: #777777;
}

textarea {
    min-height: 150px;
    resize: vertical;
}

button {
    width: 100%;
    padding: 16px;
    background: #eeeeee;
    color: #111111;
    border: none;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 2px;
    cursor: pointer;
}

button:hover {
    background: #cccccc;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#status {
    text-align: center;
    margin-top: 18px;
    min-height: 20px;
    color: #888888;
    font-size: 12px;
    letter-spacing: 1px;
}

/* REVIEWS */

.reviews-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #333333;
    padding-bottom: 15px;
    margin-bottom: 25px;
}

.reviews-title h2 {
    font-size: 18px;
    font-weight: 400;
    letter-spacing: 3px;
    margin: 0;
}

#reviewCount {
    color: #666666;
    font-size: 12px;
}

.review {
    border-bottom: 1px solid #292929;
    padding: 25px 0;
}

.review-name {
    color: #eeeeee;
    font-size: 14px;
    margin-bottom: 10px;
    letter-spacing: 1px;
}

.review-date {
    color: #555555;
    font-size: 11px;
    margin-bottom: 15px;
}

.review-message {
    color: #bbbbbb;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-word;
}

.empty {
    color: #555555;
    text-align: center;
    padding: 40px 0;
}

.loading {
    color: #666666;
    text-align: center;
    padding: 30px 0;
}

/* FOOTER */

footer {
    text-align: center;
    margin-top: 90px;
    padding-top: 25px;
    border-top: 1px solid #222222;
    color: #555555;
    font-size: 11px;
    letter-spacing: 2px;
}

/* MOBILE */

@media (max-width: 600px) {

    .page {
        padding: 45px 0;
    }

    .form {
        padding: 20px;
    }

    .header {
        margin-bottom: 50px;
    }

    .intro {
        margin-bottom: 40px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- HEADER -->

    <header class="header">
        <h1>MUHAMMED.R</h1>
        <p>PERSONAL ARCHIVE · LEAVE A TRACE</p>
    </header>


    <!-- INTRO -->

    <section class="intro">
        <h2>A SPACE FOR A THOUGHT</h2>

        <p>
            Leave a thought,<br>
            a feeling, or simply<br>
            a few words.
        </p>
    </section>


    <!-- FORM -->

    <div class="form">

        <div class="field">
            <label>NAME · OPTIONAL</label>

            <input
                id="name"
                type="text"
                placeholder="Anonymous"
                maxlength="40"
                autocomplete="off"
            >
        </div>


        <div class="field">
            <label>YOUR MESSAGE</label>

            <textarea
                id="message"
                placeholder="What did you feel here?"
                maxlength="300"
            ></textarea>
        </div>


        <button
            id="sendButton"
            onclick="sendMessage()"
        >
            LEAVE MESSAGE
        </button>

        <div id="status"></div>

    </div>


    <!-- REVIEWS -->

    <section>

        <div class="reviews-title">

            <h2>TRACES</h2>

            <span id="reviewCount">
                0
            </span>

        </div>

        <div id="reviews">

            <div class="loading">
                LOADING...
            </div>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>
        PERSONAL ARCHIVE · MUHAMMED.R
    </footer>

</div>


<script>

/*
====================================================
SUPABASE CONFIGURATION
====================================================
*/

const SUPABASE_URL =
    "https://dixbzkpjugntycfnfwze.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_w5dES3PoPGIG9iGatAJDnw_A0vJu_wb";


/*
====================================================
LOAD REVIEWS
====================================================
*/

async function loadReviews() {

    const reviewsContainer =
        document.getElementById("reviews");

    const count =
        document.getElementById("reviewCount");

    try {

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/reviews?select=*&order=created_at.desc",
            {
                method: "GET",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + SUPABASE_KEY
                }
            }
        );


        if (!response.ok) {

            const error =
                await response.text();

            console.error(error);

            reviewsContainer.innerHTML =
                '<div class="empty">COULD NOT LOAD MESSAGES.</div>';

            return;
        }


        const reviews =
            await response.json();


        count.textContent =
            reviews.length;


        if (reviews.length === 0) {

            reviewsContainer.innerHTML =
                '<div class="empty">NO TRACES YET.</div>';

            return;
        }


        reviewsContainer.innerHTML = "";


        reviews.forEach(review => {

            const reviewElement =
                document.createElement("div");

            reviewElement.className =
                "review";


            const name =
                review.name ||
                "Anonymous";


            const message =
                review.message ||
                "";


            let date = "";

            if (review.created_at) {

                date =
                    new Date(
                        review.created_at
                    ).toLocaleString(
                        "en-US",
                        {
                            year: "numeric",
                            month: "short",
                            day: "numeric"
                        }
                    );
            }


            reviewElement.innerHTML = `

                <div class="review-name">
                    ${escapeHTML(name)}
                </div>

                <div class="review-date">
                    ${escapeHTML(date)}
                </div>

                <div class="review-message">
                    ${escapeHTML(message)}
                </div>

            `;


            reviewsContainer.appendChild(
                reviewElement
            );

        });


    } catch (error) {

        console.error(error);

        reviewsContainer.innerHTML =
            '<div class="empty">CONNECTION ERROR.</div>';
    }
}


/*
====================================================
SEND MESSAGE
====================================================
*/

async function sendMessage() {

    const nameInput =
        document.getElementById("name");

    const messageInput =
        document.getElementById("message");

    const status =
        document.getElementById("status");

    const button =
        document.getElementById("sendButton");


    const name =
        nameInput.value.trim();

    const message =
        messageInput.value.trim();


    if (!message) {

        status.textContent =
            "WRITE SOMETHING FIRST.";

        messageInput.focus();

        return;
    }


    button.disabled = true;

    button.textContent =
        "SENDING...";

    status.textContent = "";


    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/reviews",
                {
                    method: "POST",

                    headers: {
                        "apikey": SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=minimal"
                    },

                    body: JSON.stringify({

                        name:
                            name ||
                            "Anonymous",

                        message:
                            message

                    })
                }
            );


        if (!response.ok) {

            const error =
                await response.text();

            console.error(
                "Supabase error:",
                error
            );

            status.textContent =
                "ERROR: MESSAGE NOT SENT.";

            button.disabled = false;

            button.textContent =
                "LEAVE MESSAGE";

            return;
        }


        /*
        ============================================
        SUCCESS
        ============================================
        */

        status.textContent =
            "MESSAGE RECEIVED.";


        nameInput.value = "";

        messageInput.value = "";


        button.disabled = false;

        button.textContent =
            "LEAVE MESSAGE";


        /*
        Reload reviews
        */

        await loadReviews();


    } catch (error) {

        console.error(error);

        status.textContent =
            "CONNECTION ERROR.";

        button.disabled = false;

        button.textContent =
            "LEAVE MESSAGE";
    }
}


/*
====================================================
SECURITY
====================================================
*/

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;
}


/*
====================================================
START
====================================================
*/

loadReviews();

</script>

</body>
</html>

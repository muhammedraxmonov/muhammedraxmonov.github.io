<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Muhammed.R — Guestbook</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #111111;
    color: #f2f0eb;
    font-family: Georgia, "Times New Roman", serif;
}

.page {
    min-height: 100vh;
    padding: 32px 25px;
}

/* HEADER */

header {
    max-width: 900px;
    margin: 0 auto;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding-bottom: 25px;

    border-bottom: 1px solid #333333;

    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 4px;

    color: #777777;
}

header a {
    color: #777777;
    text-decoration: none;
}

header a:hover {
    color: #f2f0eb;
}

/* MAIN */

main {
    max-width: 900px;
    margin: 0 auto;
}

/* INTRO */

.intro {
    padding: 100px 0 80px;
}

.label {
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 5px;
    color: #777777;
    margin-bottom: 35px;
}

h1 {
    margin: 0;

    font-size: clamp(60px, 12vw, 140px);
    font-weight: normal;
    line-height: 0.85;
    letter-spacing: -5px;
}

.intro-text {
    max-width: 600px;

    margin-top: 45px;

    font-size: clamp(20px, 3vw, 28px);
    line-height: 1.5;

    color: #aaa7a1;
}

/* FORM */

.form {
    border: 1px solid #333333;
    padding: 45px;
}

.field {
    margin-bottom: 35px;
}

label {
    display: block;

    margin-bottom: 15px;

    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 4px;

    color: #777777;
}

input,
textarea {
    width: 100%;

    border: 1px solid #444444;

    background: #171717;
    color: #f2f0eb;

    padding: 20px;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;

    outline: none;

    transition:
        border-color 0.3s ease,
        background 0.3s ease;
}

input:focus,
textarea:focus {
    border-color: #888888;
    background: #191919;
}

textarea {
    min-height: 220px;
    resize: vertical;
}

input::placeholder,
textarea::placeholder {
    color: #555555;
}

/* BUTTON */

button {
    width: 100%;

    padding: 22px;

    border: 1px solid #777777;

    background: #f2f0eb;
    color: #111111;

    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 5px;

    cursor: pointer;

    transition:
        background 0.3s ease,
        color 0.3s ease;
}

button:hover {
    background: #111111;
    color: #f2f0eb;
}

button:disabled {
    opacity: 0.5;
    cursor: wait;
}

/* STATUS */

#status {
    min-height: 20px;

    margin-top: 20px;

    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 3px;

    color: #777777;

    text-align: center;
}

/* TRACES */

.traces {
    margin-top: 120px;
}

.traces-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding-bottom: 30px;

    border-bottom: 1px solid #333333;
}

.traces-title {
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 5px;
    color: #777777;
}

#count {
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    color: #555555;
}

/* REVIEW */

#reviews {
    margin-top: 10px;
}

.review {
    padding: 50px 0;

    border-bottom: 1px solid #333333;
}

.review-top {
    display: flex;
    justify-content: space-between;
    gap: 20px;
}

.review-name {
    font-size: 20px;
    color: #aaa7a1;
}

.review-date {
    font-family: Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 2px;
    color: #555555;
    white-space: nowrap;
}

.review-message {
    max-width: 700px;

    margin-top: 35px;

    font-size: 26px;
    line-height: 1.5;

    color: #aaa7a1;
}

/* EMPTY */

.empty {
    padding: 60px 0;

    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 4px;

    color: #555555;
}

/* FOOTER */

footer {
    max-width: 900px;
    margin: 100px auto 0;

    padding-top: 25px;

    border-top: 1px solid #333333;

    display: flex;
    justify-content: space-between;

    font-family: Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 3px;

    color: #555555;
}

/* MOBILE */

@media (max-width: 600px) {

    .page {
        padding: 30px 25px;
    }

    .intro {
        padding: 75px 0 60px;
    }

    h1 {
        letter-spacing: -3px;
    }

    .form {
        padding: 25px;
    }

    .review-top {
        flex-direction: column;
        gap: 12px;
    }

    .review-message {
        font-size: 21px;
    }

    footer {
        flex-direction: column;
        gap: 15px;
    }

}

</style>

</head>


<body>

<div class="page">


<header>

<a href="index.html">
MUHAMMED.R
</a>

<div>
GUESTBOOK · 02
</div>

</header>


<main>


<section class="intro">

<div class="label">
LEAVE SOMETHING BEHIND
</div>

<h1>
Traces.
</h1>

<div class="intro-text">

A thought.
A feeling.
A few words.

Leave something here
for the next version of me.

</div>

</section>


<section class="form">


<div class="field">

<label>
NAME · OPTIONAL
</label>

<input
type="text"
id="name"
placeholder="Anonymous"
maxlength="40"
>

</div>


<div class="field">

<label>
YOUR MESSAGE
</label>

<textarea
id="message"
placeholder="What did you feel here?"
maxlength="300"
></textarea>

</div>


<button
id="submitButton"
onclick="sendMessage()"
>

LEAVE MESSAGE

</button>


<div id="status"></div>


</section>


<section class="traces">


<div class="traces-header">

<div class="traces-title">
TRACES
</div>

<div id="count">
0
</div>

</div>


<div id="reviews">

<div class="empty">
LOADING...
</div>

</div>


</section>


</main>


<footer>

<div>
PERSONAL ARCHIVE
</div>

<div>
© 2026 MUHAMMED.R
</div>

</footer>


</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://dixbzkpjugntycfnfwze.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_w5dES3PoPGIG9iGatAJDnw_A0vJu_wb";


/* =========================================
   LOAD REVIEWS
========================================= */

async function loadReviews() {

    const reviewsBox =
        document.getElementById("reviews");

    const count =
        document.getElementById("count");

    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/reviews" +
                "?select=id,name,message,created_at" +
                "&order=created_at.desc",
                {
                    method: "GET",

                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "Could not load messages."
            );

        }


        const reviews =
            await response.json();


        count.textContent =
            reviews.length;


        if (reviews.length === 0) {

            reviewsBox.innerHTML =
                `
                <div class="empty">
                    NO TRACES YET.
                </div>
                `;

            return;

        }


        reviewsBox.innerHTML = "";


        reviews.forEach(
            function(review) {

                const article =
                    document.createElement("article");

                article.className =
                    "review";


                const top =
                    document.createElement("div");

                top.className =
                    "review-top";


                const name =
                    document.createElement("div");

                name.className =
                    "review-name";

                name.textContent =
                    review.name ||
                    "Anonymous";


                const date =
                    document.createElement("div");

                date.className =
                    "review-date";


                if (review.created_at) {

                    const d =
                        new Date(
                            review.created_at
                        );

                    date.textContent =
                        d.toLocaleDateString(
                            "en-US",
                            {
                                month: "short",
                                day: "2-digit",
                                year: "numeric"
                            }
                        );

                }


                const message =
                    document.createElement("div");

                message.className =
                    "review-message";

                message.textContent =
                    review.message;


                top.appendChild(name);

                top.appendChild(date);


                article.appendChild(top);

                article.appendChild(message);


                reviewsBox.appendChild(article);

            }
        );


    }

    catch (error) {

        console.error(error);

        reviewsBox.innerHTML =
            `
            <div class="empty">
                COULD NOT LOAD TRACES.
            </div>
            `;

    }

}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage() {

    const nameInput =
        document.getElementById("name");

    const messageInput =
        document.getElementById("message");

    const status =
        document.getElementById("status");

    const button =
        document.getElementById("submitButton");


    const name =
        nameInput.value.trim() ||
        "Anonymous";

    const message =
        messageInput.value.trim();


    if (!message) {

        status.textContent =
            "WRITE SOMETHING FIRST.";

        return;

    }


    button.disabled = true;

    button.textContent =
        "SENDING...";

    status.textContent =
        "";


    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/reviews",
                {
                    method: "POST",

                    headers: {
                        "apikey": SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=minimal"
                    },

                    body: JSON.stringify({
                        name: name,
                        message: message
                    })
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            console.error(
                errorText
            );

            throw new Error(
                "Message was not saved."
            );

        }


        status.textContent =
            "MESSAGE RECEIVED.";


        nameInput.value = "";

        messageInput.value = "";


        await loadReviews();


    }

    catch (error) {

        console.error(error);

        status.textContent =
            "SOMETHING WENT WRONG.";

    }


    button.disabled = false;

    button.textContent =
        "LEAVE MESSAGE";

}


/* =========================================
   START
========================================= */

loadReviews();

</script>


</body>

</html>

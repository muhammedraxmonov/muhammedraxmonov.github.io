<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Poetry — Muhammed.R</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #111111;
    color: #f2f0eb;
    font-family: Georgia, "Times New Roman", serif;
    transition: opacity 0.5s ease;
}

body.leaving {
    opacity: 0;
}

.page {
    min-height: 100vh;
    padding: 32px 25px;
}


/* HEADER */

header {
    max-width: 900px;
    width: 100%;
    margin: 0 auto;

    padding-bottom: 25px;

    border-bottom: 1px solid #333333;

    display: flex;
    justify-content: space-between;
    align-items: center;

    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 4px;

    color: #777777;
}

header a {
    color: #777777;
    text-decoration: none;
}

header a:hover {
    color: #f2f0eb;
}


/* MAIN */

main {
    max-width: 900px;
    width: 100%;

    margin: 0 auto;

    padding: 100px 0;
}


/* TOP TEXT */

.eyebrow {
    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 5px;

    color: #777777;

    margin-bottom: 35px;
}


/* TITLE */

h1 {
    margin: 0;

    font-size: clamp(65px, 13vw, 150px);

    font-weight: normal;

    line-height: 0.85;

    letter-spacing: -5px;
}


/* DESCRIPTION */

.intro {
    max-width: 650px;

    margin-top: 45px;

    font-size: clamp(20px, 3vw, 28px);

    line-height: 1.5;

    color: #aaa7a1;
}


/* DIVIDER */

.divider {
    width: 100%;

    height: 1px;

    background: #333333;

    margin: 90px 0 45px;
}


/* POEMS */

.poems {
    display: flex;

    flex-direction: column;
}


/* POEM LINK */

.poem {
    display: block;

    padding: 35px 0;

    border-bottom: 1px solid #333333;

    color: #f2f0eb;

    text-decoration: none;

    transition:
        padding-left 0.4s ease,
        color 0.3s ease;
}

.poem:hover {
    padding-left: 15px;

    color: #aaa7a1;
}


/* NUMBER + DATE */

.poem-top {
    display: flex;

    justify-content: space-between;

    align-items: center;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 4px;

    color: #555555;

    margin-bottom: 18px;
}


/* TITLE */

.poem-title {
    display: flex;

    justify-content: space-between;

    align-items: center;

    font-size: clamp(32px, 6vw, 60px);

    line-height: 1;

    font-weight: normal;
}


/* ARROW */

.arrow {
    font-family: Arial, sans-serif;

    font-size: 30px;

    color: #777777;

    transition:
        transform 0.3s ease,
        color 0.3s ease;
}

.poem:hover .arrow {
    transform: translateX(10px);

    color: #f2f0eb;
}


/* DESCRIPTION */

.poem-description {
    margin-top: 20px;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 3px;

    color: #666666;
}


/* QUOTE */

.quote {
    margin-top: 100px;

    padding-top: 30px;

    border-top: 1px solid #333333;

    max-width: 650px;

    font-size: 20px;

    font-style: italic;

    color: #777777;
}


/* FOOTER */

footer {
    max-width: 900px;

    width: 100%;

    margin: 0 auto;

    padding-top: 25px;

    border-top: 1px solid #333333;

    display: flex;

    justify-content: space-between;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 3px;

    color: #555555;
}


/* MOBILE */

@media (max-width: 600px) {

    .page {
        padding: 30px 25px;
    }

    main {
        padding-top: 75px;
    }

    h1 {
        letter-spacing: -3px;
    }

    .poem {
        padding: 30px 0;
    }

    .poem-title {
        font-size: 34px;
    }

    .arrow {
        font-size: 24px;
    }

    .quote {
        margin-top: 80px;
    }

    footer {
        flex-direction: column;

        gap: 15px;
    }

}

</style>

</head>


<body>


<div class="page">


<header>

<a href="index.html">
MUHAMMED.R
</a>

<div>
POETRY · 01
</div>

</header>


<main>


<div class="eyebrow">
WORDS · FEELINGS · SILENCE
</div>


<h1>
Poetry
</h1>


<div class="intro">

Some words are never meant
to be spoken.

<br>

Some are meant to remain.

</div>


<div class="divider"></div>


<div class="poems">


<!-- POEM 01 -->

<a
href="poems/poem-01.html"
class="poem"
>

<div class="poem-top">

<span>
01
</span>

<span>
2026
</span>

</div>


<div class="poem-title">

<span>
Beg‘uborim
</span>

<span class="arrow">
→
</span>

</div>


<div class="poem-description">

LOVE · LOSS · LETTING GO

</div>


</a>


</div>


<div class="quote">

“Some feelings are too deep
to become ordinary words.”

</div>


</main>


<footer>

<div>
PERSONAL ARCHIVE
</div>

<div>
© 2026 MUHAMMED.R
</div>

</footer>


</div>


<script>

const links =
document.querySelectorAll("a");


links.forEach(function(link) {

    link.addEventListener(
        "click",
        function(event) {

            const href =
                link.getAttribute("href");

            if (!href) {
                return;
            }

            event.preventDefault();

            document.body.classList.add(
                "leaving"
            );

            setTimeout(function() {

                window.location.href =
                    href;

            }, 400);

        }
    );

});

</script>


</body>

</html>

<script>

/* LOCAL TIME */

function updateClock() {

    const now = new Date();

    const hours =
        String(
            now.getHours()
        ).padStart(2, "0");

    const minutes =
        String(
            now.getMinutes()
        ).padStart(2, "0");

    const seconds =
        String(
            now.getSeconds()
        ).padStart(2, "0");

    document.getElementById(
        "clock"
    ).textContent =
        hours +
        ":" +
        minutes +
        ":" +
        seconds;

}

updateClock();

setInterval(
    updateClock,
    1000
);


/* PAGE TRANSITION */

const links =
    document.querySelectorAll(
        "a"
    );

links.forEach(
    function(link) {

        link.addEventListener(
            "click",
            function(event) {

                const href =
                    link.getAttribute(
                        "href"
                    );

                if (
                    !href ||
                    href.startsWith("#") ||
                    href.startsWith("http")
                ) {
                    return;
                }

                event.preventDefault();

                document.body.style.opacity =
                    "0";

                document.body.style.transition =
                    "opacity 0.35s ease";

                setTimeout(
                    function() {

                        window.location.href =
                            href;

                    },
                    350
                );

            }
        );

    }
);

</script>
